name: Probe Shamarly source
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install --quiet pillow
          B=https://files.quran.app/hafs/shemerly/width_1200
          for n in 002 100 250 400 520; do curl -sL -m 60 $B/page$n.png -o p$n.png; done
          python3 - <<'PY'
          from PIL import Image, ImageChops
          import os
          for n in ['002','100','250','400','520']:
              f=f'p{n}.png'; im=Image.open(f)
              im.save(f'w{n}.webp','WEBP',lossless=True,method=6,quality=100)
              back=Image.open(f'w{n}.webp').convert('RGBA')
              same=ImageChops.difference(back, im.convert('RGBA')).getbbox() is None
              print('page',n,im.size,im.mode,len(im.getcolors(70000) or []),'colors png',os.path.getsize(f),'webp-lossless',os.path.getsize(f'w{n}.webp'),'identical',same)
          PY
