:root{
  --bg:#f4f1e8; --card:#fffdf6; --ink:#1f2a24; --muted:#6b756e;
  --green:#1f6b4f; --green-d:#14503a; --gold:#b8892b; --line:#e4dfcf; --ok:#2e8b57; --warn:#b5522b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1713; --card:#17221c; --ink:#e9efe9; --muted:#97a69c; --green:#3fae84; --green-d:#2f8c68; --gold:#d9ac4e; --line:#26352c; --ok:#4cc58e; --warn:#e08a5f}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,sans-serif}
body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 84px);-webkit-user-select:none;user-select:none}
.wrap{max-width:560px;margin:0 auto}
header{text-align:center;padding:10px 0 4px}
header h1{font-family:'Amiri',serif;font-size:28px;margin:0;color:var(--green)}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:500 14px 'Tajawal';cursor:pointer}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.big{position:relative;width:230px;height:230px;margin:10px auto}
.big svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.big .tap{position:absolute;inset:14px;border-radius:50%;border:none;background:var(--green);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(31,107,79,.28);transition:transform .08s}
.big .tap:active{transform:scale(.96);background:var(--green-d)}
.big .n{font:700 56px 'Tajawal';line-height:1}
.big .lbl{font:400 15px 'Amiri',serif;margin-top:8px;padding:0 18px;text-align:center;opacity:.95}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--green)}
.stats span{font-size:12px;color:var(--muted)}
button.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:9px 14px;font:500 14px 'Tajawal';cursor:pointer}
button.pri{border:none;background:var(--green);color:#fff;border-radius:12px;padding:10px 16px;font:700 14px 'Tajawal';cursor:pointer}
.ayah{font-family:'Amiri',serif;font-size:21px;line-height:2;text-align:center;margin:6px 0}
.sub{color:var(--muted);font-size:13px}
.z{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:16px;margin:10px 0;cursor:pointer}
.z .t{flex:1;font-family:'Amiri',serif;font-size:20px;line-height:1.95}
.z .meta{font-size:12px;color:var(--muted);font-family:'Tajawal'}
.z .badge{min-width:48px;height:48px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font:700 18px 'Tajawal'}
.z.done{opacity:.55}
.z.done .badge{background:var(--ok)}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav button{flex:1;border:none;background:none;color:var(--muted);font:500 12px 'Tajawal';padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--green);font-weight:700}
.toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);max-width:536px;margin:0 auto;background:var(--green-d);color:#fff;border-radius:16px;padding:14px 16px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(-140%);transition:transform .35s}
.toast.show{transform:none}
.toast .tt{font-family:'Amiri',serif;font-size:20px;line-height:1.8}
.toast button{margin-top:8px;background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px;padding:7px 14px;font:500 13px 'Tajawal';cursor:pointer}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sw:last-child{border:none}
.sw input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}
.sw select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:500 14px 'Tajawal'}
.chk{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border:none}
.chk .dot{flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 14px 'Tajawal';background:var(--warn)}
.chk.ok .dot{background:var(--ok)}
.chk .tx{flex:1;line-height:1.6}
.chk .tx small{display:block;color:var(--muted);font-size:12px}
.chk button{flex:0 0 auto}
.chk.ok button{display:none}
.banner{background:var(--warn);color:#fff;border:none}
.banner .row{gap:12px}
.banner button{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:10px;padding:8px 12px;font:700 13px 'Tajawal';flex:0 0 auto}
.guide{line-height:1.9;font-size:14px}
.guide b{color:var(--ink)}
.guide ol{margin:6px 0;padding-inline-start:20px}
.hidden{display:none}
</style>

var S=load('azkar.v1',null)||{};
S.settings=S.settings||{hourly:true,sound:true,notif:false,vibrate:true,from:5,to:23};
S.counts=S.counts||{};
S.lists=S.lists||{};
S.sel=S.sel||'salawat';
S.targets=S.targets||{};
S.lastHour=S.lastHour||'';
var tab='home';
function persist(){save('azkar.v1',S)}
function todayCounts(){var d=today();S.counts[d]=S.counts[d]||{};return S.counts[d]}
function todayList(id){var d=today();S.lists[d]=S.lists[d]||{};S.lists[d][id]=S.lists[d][id]||{};return S.lists[d][id]}
function totalToday(){var c=todayCounts(),s=0;for(var k in c)s+=c[k];return s}
function streak(){
  var n=0,d=new Date();
  for(var i=0;i<400;i++){
    var c=S.counts[dkey(d)],has=false;
    if(c){for(var t in c){if(c[t]>0){has=true;break}}}
    if(has)n++;else if(i>0)break;
    d.setDate(d.getDate()-1);
  }
  return n;
}
function grand(id){var s=0;for(var d in S.counts){s+=(S.counts[d][id]||0)}return s}
function pruneOld(){
  var keys=Object.keys(S.counts).sort();
  while(keys.length>400){delete S.counts[keys.shift()]}
  keys=Object.keys(S.lists).sort();
  while(keys.length>7){delete S.lists[keys.shift()]}
}

/* ---------- الصوت والاهتزاز داخل التطبيق ---------- */
var actx=null;
function unlockAudio(){try{if(!actx){var A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function chime(){
  if(!S.settings.sound)return;
  try{
    unlockAudio();if(!actx)return;
    [523.25,659.25,783.99].forEach(function(f,i){
      var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*0.22;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+1);
    });
  }catch(e){}
}
function buzz(ms){if(S.settings.vibrate){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}}

/* ---------- التذكير ---------- */
var toastEl=document.getElementById('toast'),toastText=document.getElementById('toastText');
function showToast(txt){
  toastText.textContent=txt;toastEl.classList.add('show');chime();buzz([120,60,120]);
  if(!NATIVE&&S.settings.notif){try{if(window.Notification&&Notification.permission==='granted'){new Notification('حان وقت الصلاة على النبي ﷺ',{body:txt})}}catch(e){}}
}
document.getElementById('toastClose').onclick=function(){toastEl.classList.remove('show')};
function inWindow(h){var a=S.settings.from,b=S.settings.to;return a<=b?(h>=a&&h<=b):(h>=a||h<=b)}
// في المتصفح فقط: التنبيه يعمل والصفحة مفتوحة. في التطبيق يتولاه نظام أندرويد.
function tick(){
  if(NATIVE||!S.settings.hourly)return;
  var d=new Date(),key=today()+'-'+d.getHours();
  if(d.getMinutes()===0&&S.lastHour!==key&&inWindow(d.getHours())){
    S.lastHour=key;persist();
    showToast(SALAWAT[Math.floor(Math.random()*SALAWAT.length)]);
  }
}
setInterval(tick,15000);

function syncNative(){
  if(!Reminder)return Promise.resolve();
  return Reminder.configure({enabled:!!S.settings.hourly,from:S.settings.from,to:S.settings.to})
    .then(function(r){NS=r;return r}).catch(function(){});
}
function refreshNative(){
  if(!Reminder)return Promise.resolve();
  return Reminder.getStatus().then(function(r){NS=r;return r}).catch(function(){});
}
function setupOk(){return !NS||(NS.notifications&&NS.exactAlarms&&NS.ignoringBattery)}
function fmtTime(ms){
  var d=new Date(ms),h=d.getHours(),m=d.getMinutes(),pm=h>=12,h12=h%12||12;
  var sameDay=dkey(d)===today();
  return (sameDay?'اليوم':'غدًا')+' الساعة '+ar(h12)+':'+ar(String(m).padStart(2,'0'))+' '+(pm?'م':'ص');
}
function nextReminderText(){
  if(!S.settings.hourly)return 'التذكير الساعي متوقف';
  if(NATIVE){
    if(NS&&!NS.notifications)return 'الإشعارات غير مسموح بها، افتح الإعدادات لتفعيلها';
    if(NS&&NS.nextAt)return 'التذكير القادم: '+fmtTime(NS.nextAt);
    return 'التذكير الساعي مفعّل';
  }
  var d=new Date(),m=60-d.getMinutes();
  return 'التذكير القادم بعد '+ar(m)+' دقيقة تقريبًا (والصفحة مفتوحة)';
}

var view=document.getElementById('view'),nav=document.getElementById('nav');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ar(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
function $(id){return document.getElementById(id)}

function renderNav(){
  nav.innerHTML=TABS.map(function(t){return '<button data-t="'+t.id+'" class="'+(t.id===tab?'on':'')+'"><span class="ic">'+t.i+'</span>'+t.n+'</button>'}).join('');
  Array.prototype.forEach.call(nav.querySelectorAll('button'),function(b){b.onclick=function(){go(b.getAttribute('data-t'))}});
}
function go(t){tab=t;window.scrollTo(0,0);render()}

function render(){
  renderNav();
  if(tab==='home')renderHome();
  else if(tab==='various')renderList('various',VARIOUS,'ذكر الله بصيغ متنوعة');
  else if(tab==='morning')renderList('morning',MORNING,'أذكار الصباح');
  else if(tab==='evening')renderList('evening',EVENING,'أذكار المساء');
  else if(tab==='prayer')renderList('prayer',AFTER_PRAYER,'أذكار بعد الصلاة');
  else renderSettings();
}

function ring(p){
  var r=104,c=2*Math.PI*r,off=c*(1-Math.min(1,p));
  return '<svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="115" cy="115" r="'+r+'" fill="none" stroke="var(--gold)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/></svg>';
}

function renderHome(){
  var cur=COUNTER_TYPES.filter(function(x){return x.id===S.sel})[0]||COUNTER_TYPES[0];
  var target=S.targets[cur.id]||cur.target;
  var n=todayCounts()[cur.id]||0;
  view.innerHTML=
   (UPD?'<div class="card banner" style="background:var(--green)"><div class="row"><span>نسخة جديدة من التطبيق متاحة ('+esc(UPD.name)+')</span><button id="getUpd">تحميل</button></div></div>':'')+
   (NATIVE&&S.settings.hourly&&!setupOk()?'<div class="card banner"><div class="row"><span>لضمان وصول التذكير والهاتف مقفل، أكمل الإعداد (دقيقة واحدة).</span><button id="fixSetup">أكمل الإعداد</button></div></div>':'')+
   '<div class="card"><div class="chips" id="chips">'+COUNTER_TYPES.map(function(t){return '<button class="chip '+(t.id===cur.id?'on':'')+'" data-id="'+t.id+'">'+esc(t.s)+'</button>'}).join('')+'</div>'+
   '<div class="big">'+ring(n/target)+'<button class="tap" id="tap" aria-label="عدّ"><span class="n" id="cnt">'+ar(n)+'</span><span class="lbl">'+esc(cur.t)+'</span></button></div>'+
   '<div class="row"><span class="sub">الهدف اليومي: <b>'+ar(target)+'</b></span><span><button class="ghost" id="tgt">تغيير الهدف</button> <button class="ghost" id="rst">تصفير</button></span></div></div>'+
   '<div class="card stats"><div><b>'+ar(totalToday())+'</b><span>إجمالي اليوم</span></div><div><b>'+ar(grand(cur.id))+'</b><span>إجمالي «'+esc(cur.s)+'»</span></div><div><b>'+ar(streak())+'</b><span>أيام متتالية</span></div></div>'+
   '<div class="card"><div class="ayah">﴿ إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ ۚ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا ﴾</div></div>'+
   '<div class="card"><div class="row"><span class="sub" id="nextTxt">'+esc(nextReminderText())+'</span><button class="ghost" id="testRem">جرّب التنبيه</button></div></div>';
  if($('getUpd'))$('getUpd').onclick=function(){Reminder.openUrl({url:UPD.url})};
  if($('fixSetup'))$('fixSetup').onclick=function(){go('settings')};
  Array.prototype.forEach.call(view.querySelectorAll('.chip'),function(b){b.onclick=function(){S.sel=b.getAttribute('data-id');persist();renderHome()}});
  $('tap').onclick=function(){
    unlockAudio();
    var c=todayCounts();c[cur.id]=(c[cur.id]||0)+1;pruneOld();persist();
    var v=c[cur.id];
    if(v===target){buzz([80,40,80,40,160]);chime()}else buzz(12);
    renderHomeFast(cur,target,v);
  };
  $('rst').onclick=function(){todayCounts()[cur.id]=0;persist();renderHome()};
  $('tgt').onclick=function(){
    var opts=[33,100,300,500,1000],i=opts.indexOf(target);
    S.targets[cur.id]=opts[(i+1)%opts.length];persist();renderHome();
  };
  $('testRem').onclick=testReminder;
}
function renderHomeFast(cur,target,v){
  var el=$('cnt');if(!el){renderHome();return}
  el.textContent=ar(v);
  var big=view.querySelector('.big svg');
  var tmp=document.createElement('div');tmp.innerHTML=ring(v/target);
  big.parentNode.replaceChild(tmp.firstChild,big);
  var st=view.querySelectorAll('.stats b');
  if(st.length===3){st[0].textContent=ar(totalToday());st[1].textContent=ar(grand(cur.id));st[2].textContent=ar(streak())}
}

function testReminder(){
  unlockAudio();
  if(Reminder){
    var p=(NS&&!NS.notifications)?Reminder.requestNotifications():Promise.resolve();
    p.then(function(){return Reminder.test()}).then(function(r){NS=r}).catch(function(){});
  }else showToast(SALAWAT[Math.floor(Math.random()*SALAWAT.length)]);
}

function renderList(id,items,title){
  var st=todayList(id),done=0;
  items.forEach(function(it,i){if((st[i]||0)>=it.c)done++});
  var pct=Math.round(done/items.length*100);
  var h='<div class="card"><div class="row"><b style="font-size:18px">'+title+'</b><button class="ghost" id="resetList">إعادة</button></div>'+
        '<div class="prog"><i style="width:'+pct+'%"></i></div><div class="sub">أُنجز '+ar(done)+' من '+ar(items.length)+'</div></div>';
  items.forEach(function(it,i){
    var got=st[i]||0,rem=Math.max(0,it.c-got),isDone=rem===0;
    h+='<div class="z '+(isDone?'done':'')+'" data-i="'+i+'"><div class="t">'+esc(it.t)+(it.m?'<div class="meta">'+esc(it.m)+'</div>':'')+'</div><div class="badge">'+(isDone?'✓':ar(rem))+'</div></div>';
  });
  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll('.z'),function(el){
    el.onclick=function(){
      unlockAudio();
      var i=+el.getAttribute('data-i'),it=items[i];
      if((st[i]||0)>=it.c)return;
      st[i]=(st[i]||0)+1;
      var c=todayCounts();c.list=(c.list||0)+1;
      persist();buzz(10);
      if(st[i]>=it.c)buzz(60);
      var y=window.scrollY;renderList(id,items,title);window.scrollTo(0,y);
    };
  });
  $('resetList').onclick=function(){S.lists[today()][id]={};persist();renderList(id,items,title)};
}

    html+=
     '<div class="card"><b style="font-size:18px">ضمان وصول التذكير والهاتف مقفل</b>'+
      '<div class="chk '+(n.notifications?'ok':'')+'"><span class="dot">'+(n.notifications?'✓':'١')+'</span><span class="tx">السماح بالإشعارات<small>ليظهر التذكير ويُسمع صوته.</small></span><button class="pri" id="fixNotif">سماح</button></div>'+
      '<div class="chk '+(n.exactAlarms?'ok':'')+'"><span class="dot">'+(n.exactAlarms?'✓':'٢')+'</span><span class="tx">المنبّهات والتذكيرات<small>ليأتي التذكير في رأس الساعة تمامًا. فعّل المفتاح ثم ارجع.</small></span><button class="pri" id="fixExact">تفعيل</button></div>'+
      '<div class="chk '+(n.ignoringBattery?'ok':'')+'"><span class="dot">'+(n.ignoringBattery?'✓':'٣')+'</span><span class="tx">استثناء من توفير البطارية<small>حتى لا يوقف النظام التذكير في الخلفية. اختر «سماح».</small></span><button class="pri" id="fixBatt">استثناء</button></div>'+
     '</div>'+
     '<div class="card guide sub"><b>خطوة إضافية حسب نوع هاتفك</b><br>'+oemTips(n.manufacturer)+
      '<div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="ghost" id="openAuto">فتح إعدادات التشغيل التلقائي</button><button class="ghost" id="openNotifSet">إعدادات صوت الإشعار</button></div>'+
      '<div style="margin-top:8px">إن لم تسمع الصوت: تأكد أن مستوى صوت <b>الإشعارات/الرنين</b> مرتفع، وأن وضع «عدم الإزعاج» متوقف.</div>'+
     '</div>';
  }
  html+=
   '<div class="card"><b style="font-size:18px">داخل التطبيق</b>'+
    '<div class="sw"><span>صوت عند إتمام الهدف</span><input type="checkbox" id="sSound" '+(s.sound?'checked':'')+'></div>'+
    '<div class="sw"><span>اهتزاز عند العدّ</span><input type="checkbox" id="sVib" '+(s.vibrate?'checked':'')+'></div>'+
    (NATIVE?'':'<div class="sw"><span>إشعارات المتصفح (إن سمح بها)</span><input type="checkbox" id="sNotif" '+(s.notif?'checked':'')+'></div>')+
   '</div>'+
   (NATIVE?'':'<div class="card sub" style="line-height:1.9"><b style="color:var(--ink)">ملاحظة</b><br>في المتصفح يعمل التنبيه ما دامت الصفحة مفتوحة. ثبّت تطبيق أندرويد ليصلك والهاتف مقفل.</div>')+
   (NATIVE&&NS&&NS.versionName?'<div class="card"><div class="row"><span>إصدار التطبيق: '+esc(NS.versionName)+'</span><button class="ghost" id="chkUpd">'+(UPD?'تحميل النسخة الجديدة':'التحقق من التحديث')+'</button></div></div>':'')+
   '<div class="card"><div class="row"><span>مسح بيانات العدّاد</span><button class="ghost" id="wipe">مسح</button></div></div>';
  view.innerHTML=html;

  function bind(id,key,after){$(id).onchange=function(){s[key]=this.checked;persist();if(after)after()}}
  bind('sHourly','hourly',function(){syncNative().then(rerenderSettings)});
  bind('sSound','sound');bind('sVib','vibrate');
  $('sFrom').onchange=function(){s.from=+this.value;persist();syncNative().then(rerenderSettings)};
  $('sTo').onchange=function(){s.to=+this.value;persist();syncNative().then(rerenderSettings)};
  $('testRem2').onclick=testReminder;
  if(NATIVE){
    $('fixNotif').onclick=function(){Reminder.requestNotifications().then(function(r){NS=r;rerenderSettings()}).catch(function(){})};
    $('fixExact').onclick=function(){Reminder.openExactAlarmSettings().catch(function(){})};
    $('fixBatt').onclick=function(){Reminder.requestIgnoreBattery().catch(function(){})};
    $('openAuto').onclick=function(){Reminder.openAutostart().catch(function(){})};
    if($('chkUpd'))$('chkUpd').onclick=function(){
      if(UPD){Reminder.openUrl({url:UPD.url});return}
      var b=this;b.textContent='جارٍ التحقق…';checkUpdate(true);
      setTimeout(function(){if(!UPD)b.textContent='لديك أحدث نسخة ✓';else rerenderSettings()},2500);
    };
    $('openNotifSet').onclick=function(){Reminder.openNotificationSettings().catch(function(){})};
  }else{
    $('sNotif').onchange=function(){
      var box=this;s.notif=box.checked;persist();
      if(box.checked){try{window.Notification&&Notification.requestPermission().then(function(p){if(p!=='granted'){s.notif=false;box.checked=false;persist()}}).catch(function(){s.notif=false;box.checked=false;persist()})}catch(e){s.notif=false;box.checked=false;persist()}}
    };
  }
  $('wipe').onclick=function(){if(confirm('مسح كل بيانات العدّاد والتقدم؟')){S.counts={};S.lists={};persist();render()}};
}
function rerenderSettings(){if(tab==='settings'){var y=window.scrollY;renderSettings();window.scrollTo(0,y)}else if(tab==='home')renderHome()}

/* عند الرجوع من إعدادات النظام: حدّث الحالة */
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  tick();
  if(NATIVE)refreshNative().then(function(){if(tab==='settings'||tab==='home')rerenderSettings()});
  else if(tab==='home')renderHome(); // تحديث العدّاد عند بداية يوم جديد
});

/* ---------- التحقق من وجود نسخة جديدة (مرة يوميًا) ---------- */
var UPD=null, RELEASES='https://api.github.com/repos/sayed-elghamry/adhkar-app/releases/latest';
function checkUpdate(force){
  if(!NATIVE||!NS||!NS.versionCode)return;
  var last=+(sGet('upd.last')||0);
  var cached=load('upd.info',null);
  function apply(info){
    if(info&&info.n>NS.versionCode){UPD=info;if(tab==='home')renderHome()}
  }
  if(!force&&Date.now()-last<6*3600e3){apply(cached);return}
  fetch(RELEASES,{headers:{'Accept':'application/vnd.github+json'}}).then(function(r){return r.ok?r.json():null}).then(function(j){
    if(!j||!j.tag_name)return;
    var m=/(\d+)$/.exec(j.tag_name);if(!m)return;
    var a=(j.assets||[]).filter(function(x){return /\.apk$/.test(x.name)})[0];
    var info={n:+m[1],name:j.name||j.tag_name,url:a?a.browser_download_url:j.html_url};
    sSet('upd.last',String(Date.now()));save('upd.info',info);apply(info);
  }).catch(function(){apply(cached)});
}

/* ---------- البدء ---------- */
render();tick();
if(NATIVE){
  syncNative().then(function(){
    render();
    checkUpdate(false);
    // أول تشغيل: اطلب إذن الإشعارات مباشرة
    if(NS&&!NS.notifications&&!S.askedNotif){
      S.askedNotif=true;persist();
      Reminder.requestNotifications().then(function(r){NS=r;render()}).catch(function(){});
    }
  });
}
})();
</script>
</body>
</html>
