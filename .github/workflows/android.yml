name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install & sync
        run: |
          npm ci
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: adhkar-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release (direct phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk adhkar.apk
          gh release create "build-${{ github.run_number }}" adhkar.apk \
            --title "أذكار - نسخة ${{ github.run_number }}" \
            --notes "ملف APK للتثبيت المباشر على أندرويد." --latest
