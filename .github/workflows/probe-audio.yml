name: probe-audio
on:
  push:
    paths: ['.github/workflows/probe-audio.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s --max-time 30 "https://mp3quran.net/api/v3/reciters?language=ar" -o r.json
          printf '%s\n' "import json" "d=json.load(open('r.json'))" "for r in d['reciters']:" "    for m in r['moshaf']:" "        if any(k in r['name'] for k in ['البنا','مصطفى','المنشاوي','الحصري','عبدالباسط','عبد الباسط']): print('MP3Q', r['id'], r['name'], '|', m['name'], '|', m['server'], m['surah_total'])" > p.py
          python3 p.py
          curl -sI --max-time 20 https://server8.mp3quran.net/bna/001.mp3 | grep -iE "^HTTP|access-control|content-type" | sed 's/^/HDR /'
