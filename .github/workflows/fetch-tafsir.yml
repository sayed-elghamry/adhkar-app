name: fetch-tafsir
on:
  push:
    paths: ['.github/workflows/fetch-tafsir.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Tafsir al-Muyassar
        run: |
          set -e
          curl -sSfL --retry 4 https://api.alquran.cloud/v1/quran/ar.muyassar -o raw.json
          python3 - <<'PY'
          import json
          d=json.load(open('raw.json'))['data']
          print(d['edition'])
          out=[[a['text'].strip() for a in s['ayahs']] for s in d['surahs']]
          print(len(out), sum(len(x) for x in out))
          json.dump(out, open('muyassar.json','w'), ensure_ascii=False, separators=(',',':'))
          PY
          ls -la muyassar.json
      - name: Publish as prerelease asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create data-muyassar muyassar.json --repo ${{ github.repository }} --prerelease --title "data: tafsir muyassar" --notes "Source data for the app (not an app build)"
