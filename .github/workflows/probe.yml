name: Probe Shamarly source
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://files.quran.app/hafs/shemerly
          for u in $B/width_1200/page001.png $B/width_1200/page002.png $B/width_1200/page250.png $B/zips/images_1200.zip $B/zips/images_1200.zip.md5; do
            echo "== $u"; curl -sIL -m 30 "$u" | grep -iE "^HTTP|content-length|content-type|last-modified" ; done
          curl -sL -m 60 $B/width_1200/page250.png -o p.png && python3 -c "
          import struct;d=open('p.png','rb').read();print('png',len(d),struct.unpack('>II',d[16:24]), 'colortype',d[25],'bitdepth',d[24])"
