name: probe-audio
on:
  push:
    paths: ['.github/workflows/probe-audio.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in Husary_128kbps Husary_64kbps Husary_Mujawwad_128kbps Minshawy_Murattal_128kbps Minshawy_Mujawwad_192kbps Abdul_Basit_Murattal_192kbps Abdul_Basit_Murattal_64kbps Abdul_Basit_Mujawwad_128kbps Mustafa_Ismail_48kbps mahmoud_ali_al_banna_32kbps Mahmoud_Ali_Al_Banna_32kbps; do
            c=$(curl -s -o /dev/null -w "%{http_code} %{size_download} %{content_type}" --max-time 20 https://everyayah.com/data/$f/002255.mp3); echo "PROBE $f $c"
            curl -sI --max-time 20 https://everyayah.com/data/$f/002255.mp3 | grep -i "access-control" | sed "s/^/CORS $f /"
          done
          curl -s --max-time 30 https://everyayah.com/recitations_ayat.html | grep -oiE 'data/[A-Za-z0-9_\.-]+' | sort -u | grep -iE 'banna|ismail|husary|minsh|basit' | sed 's/^/LIST /'
