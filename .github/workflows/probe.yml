name: Probe Shamarly source
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install --quiet pillow
          curl -sL -m 60 https://files.quran.app/hafs/shemerly/width_1200/page004.png -o a.png
          curl -sL -m 60 https://archive.org/download/20191116_20191116_1655/page/n4_w900.jpg -o b.jpg
          python3 - <<'PY'
          from PIL import Image
          import base64, io
          for f in ['a.png','b.jpg']:
              im=Image.open(f).convert('RGB'); print(f, im.size)
              c=im.crop((0,0,im.width,im.height//3)).resize((500, round(im.height//3*500/im.width)))
              bio=io.BytesIO(); c.save(bio,'JPEG',quality=70)
              print('B64'+f+':'+base64.b64encode(bio.getvalue()).decode())
          PY
